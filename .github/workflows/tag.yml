name: Add tarball to draft release
on:
  push:
    tags: ["v*"]

jobs:
  add-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - run: npm pack
      - run: gh release create ${{ github.ref_name }} --draft *.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
